<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercici 09 - Estils CSS3</title>
    <style>
        .contenidor {
            display: flex;
            align-items: flex-start;
        }

        .caixa {
            margin: 10px;
            color: #000;
            font-family: Arial, sans-serif;
            font-weight: bold;
            padding: 10px;
            box-sizing: border-box;
        }

        .caixa1 {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            background-image: linear-gradient(to right, #FFFFFF, #FFA500);
        }

        .caixa2 {
            width: 200px;
            height: 400px;
            border-radius: 5px;
            background-color: #FF7F7F;
        }

        .caixa3 {
            width: 300px;
            height: 100px;
            border: 5px solid gray;
            border-radius: 10px;
            box-shadow: 10px 10px 0px 0px black;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="contenidor">
        <div class="caixa caixa1">1</div>
        <div class="caixa caixa2">2</div>
        <div class="caixa caixa3">3</div>
    </div>
</body>
</html>
