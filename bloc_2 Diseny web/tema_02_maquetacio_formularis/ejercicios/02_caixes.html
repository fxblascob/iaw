<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Exercici 02 - Flexbox i caixes</title>
    <style>
        .contenidor {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .caixa1 {
            background-color: #4a90e2;
            color: white;
            border: 2px solid gray;
            width: 50%;
            height: 100px;
        }
        .caixa2 {
            background-color: #fff3b0;
            border: none;
            width: 20%;
            height: 60px;
        }
        .caixa3 {
            background-color: #f28b82;
            border: 1px solid black;
            width: 100%;
            height: 60px;
        }
    </style>
</head>
<body>
    <div class="contenidor">
        <div class="caixa1">1</div>
        <div class="caixa2">2</div>
        <div class="caixa3">3</div>
    </div>
</body>
</html>
