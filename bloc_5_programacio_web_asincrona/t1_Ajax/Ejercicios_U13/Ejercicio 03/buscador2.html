<html>
<head>
   <meta charset="utf8" />
   <script type="text/javascript" src="prototype.js"></script>
   <script type="text/javascript">

      function busca()
      {
         var texto=document.getElementById("busqueda").value;
         new Ajax.Updater("resultados", "busca.php", { method:"get", parameters:"texto=" + texto} );
      }

   </script>
</head>
<body>
<h1>Buscador de personas</h1>
<input type="text" id="busqueda" onkeyup="javascript:busca()" />
<div id="resultados">
</div>
</body>
</html>
