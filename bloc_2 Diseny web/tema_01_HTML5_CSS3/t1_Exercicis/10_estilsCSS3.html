<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercici 10 - Transicions CSS3</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        .contenidor {
            display: flex;
            align-items: flex-start;
            padding: 10px;
        }

        .caixa {
            margin: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Caixa 1: baixa 200px quan es passa el ratolí dins del document */
        .caixa1 {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            background-image: linear-gradient(to right, #FFFFFF, #FFA500);
            position: relative;
            top: 0px;
            transition: top 1s ease-out;
        }

        body:hover .caixa1 {
            top: 200px;
        }

        /* Caixa 2: canvia de roig clar a blau clar en 2 segons */
        .caixa2 {
            width: 200px;
            height: 400px;
            border-radius: 5px;
            background-color: #FF7F7F;
            transition: background-color 2s ease;
        }

        .caixa2:hover {
            background-color: #ADD8E6;
        }

        /* Caixa 3: es desplaça 20px cap avall en 1 segon */
        .caixa3 {
            width: 300px;
            height: 100px;
            border: 5px solid gray;
            border-radius: 10px;
            box-shadow: 10px 10px 0px 0px black;
            background-color: white;
            position: relative;
            top: 0px;
            transition: top 1s ease;
        }

        .caixa3:hover {
            top: 20px;
        }
    </style>
</head>
<body>
    <div class="contenidor">
        <div class="caixa caixa1">1</div>
        <div class="caixa caixa2">2</div>
        <div class="caixa caixa3">3</div>
    </div>
</body>
</html>
